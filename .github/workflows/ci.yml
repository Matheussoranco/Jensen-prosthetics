name: Firmware checks (host suite + compile-only target build)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Host checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Host control-core regression suite
        run: python firmware/tools/run_core_tests.py
      - name: Application syntax against declaration stubs
        run: python firmware/tools/check_app_syntax.py

  # Builds the real ESP32 image with the real Arduino-ESP32 framework and
  # libraries. COMPILE ONLY: no `-t upload`, no `pio device monitor`. GitHub
  # runners have no serial device attached. A successful build proves the
  # firmware compiles and links for the target. It says nothing about behaviour
  # on hardware.
  target-build:
    name: ESP32 target build (compile only, no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLATFORMIO_VERSION: '6.2.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Cache PlatformIO packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO Core (pinned)
        run: python -m pip install "platformio==${PLATFORMIO_VERSION}"
      - name: Build esp32dev (no upload)
        working-directory: firmware
        run: pio run -e esp32dev 2>&1 | tee build.log
        shell: bash
      - name: Record toolchain, libraries and artifact digests
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          out=.pio/build/esp32dev
          {
            echo "# Jensen ESP32 target build record"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- PlatformIO Core: \`$(pio --version)\`"
            echo "- upload: **none** (compile-only job)"
            echo
            echo "## Resolved packages"
            echo '```'
            pio pkg list -e esp32dev
            echo '```'
            echo
            echo "## Memory use"
            echo '```'
            grep -E '^(RAM|Flash):' build.log || echo "(usage lines not found in build.log)"
            echo '```'
            echo
            echo "## Artifacts (SHA-256, bytes)"
            echo '```'
            for f in firmware.bin firmware.elf bootloader.bin partitions.bin; do
              if [ -f "$out/$f" ]; then
                printf '%s  %s  %s\n' "$(sha256sum "$out/$f" | cut -d' ' -f1)" "$(stat -c%s "$out/$f")" "$f"
              fi
            done
            echo '```'
          } > build-record.md
          cat build-record.md >> "$GITHUB_STEP_SUMMARY"
          cat build-record.md
      - name: Keep the build outputs as a CI artifact (not a device upload)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jensen-esp32dev-${{ github.sha }}
          path: |
            firmware/.pio/build/esp32dev/firmware.bin
            firmware/.pio/build/esp32dev/firmware.elf
            firmware/.pio/build/esp32dev/bootloader.bin
            firmware/.pio/build/esp32dev/partitions.bin
            firmware/build-record.md
            firmware/build.log
          if-no-files-found: error
          retention-days: 30
