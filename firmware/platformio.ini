; Jensen Hand — firmware build configuration.
;
;   pio run -e esp32dev             build
;   pio run -e esp32dev -t upload   flash
;   pio device monitor              serial console / CLI
;   pio test -e native              run the control-core tests on the host
;
; The host tests can also be run without PlatformIO:
;   python tools/run_core_tests.py

[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib
test_dir = test

[env]
build_flags =
    -Wall
    -Wextra

; -----------------------------------------------------------------------------
; Target: ESP32 DevKit on the Jensen forearm expansion board
; -----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2

build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    ; Handedness of this build. Only seeds the factory defaults — the stored
    ; configuration wins once the hand has been calibrated.
    -DJENSEN_DEFAULT_SIDE_RIGHT=1

build_unflags =
    -std=gnu++11

; The native suite exercises lib/jensen_core only; it must not be cross-built.
test_ignore = native

; -----------------------------------------------------------------------------
; Host: control-core unit tests
;
; `test_build_src` stays at its default of `no`, so src/ (which is Arduino
; code) is never part of this build. Only lib/jensen_core and test/native are.
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = custom
build_flags =
    ${env.build_flags}
    -std=c++17
    -Ilib/jensen_core
    -Itest/native
